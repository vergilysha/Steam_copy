<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <title>Document</title>
</head>
<body>
  <div class="slider">
    <div class="main-row">

      <button class="nav-btn nav-prev" aria-label="Previous">&#8249;</button>

      <div class="hero">
        <img src="img/cyber.jpg" alt="Cyberpunk 2077" id="hero-img">
        <div class="hero-info">
          <div class="cont">
            <div class="hero-title">Cyberpunk 2077</div>
            <div class="hero-rating">Very Positive&nbsp;(98,231 reviews)</div>
          </div>
          <div class="price-wrap">
            <span class="discount">-36%</span>
            <span class="price-old">$89.99</span>
            <span class="price">$49.99</span>
          </div>
        </div>
      </div>

      <div class="sidebar">
        <div class="sidebar-title">FEATURED &amp; RECOMMENDED</div>
        <div class="games">
          <div class="game-row">
            <img src="img/rdr2.jpg" alt="RDR2">
            <div class="game-info">
              <div class="game-name">Red Dead Redemption 2</div>
              <div class="price-wrap"><span class="price no-disc">$59.99</span></div>
            </div>
          </div>
          <div class="game-row">
            <img src="img/elden.jpg" alt="Elden Ring">
            <div class="game-info">
              <div class="game-name">Elden Ring</div>
              <div class="price-wrap">
                <span class="discount">-33%</span>
                <span class="price-old">$89.99</span>
                <span class="price">$59.99</span>
              </div>
            </div>
          </div>
          <div class="game-row">
            <img src="img/baldur.jpg" alt="Baldur's Gate 3">
            <div class="game-info">
              <div class="game-name">Baldur's Gate 3</div>
              <div class="price-wrap"><span class="price no-disc">$59.99</span></div>
            </div>
          </div>
          <div class="game-row">
            <img src="img/gtav.jpg" alt="GTA V">
            <div class="game-info">
              <div class="game-name">GTA V</div>
              <div class="price-wrap">
                <span class="discount">-50%</span>
                <span class="price-old">$89.99</span>
                <span class="price">$29.99</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button class="nav-btn nav-next" aria-label="Next">&#8250;</button>

  </div>

  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
