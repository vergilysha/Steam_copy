<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>API — Redirecting</title>
  <noscript><meta http-equiv="refresh" content="0;url=./index.html"></noscript>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./api-sw.js', { scope: './' })
        .finally(() => location.replace('./index.html'));
    } else {
      location.replace('./index.html');
    }
  </script>
</head>
<body></body>
</html>
